<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* CSS Keyframe Animations for Dynamic Aspect */
    @keyframes pulseCircle {
      0% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.6; }
      100% { transform: scale(1); opacity: 0.3; }
    }
    @keyframes floatWave {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }

    .anim-circle-1 {
      animation: pulseCircle 6s ease-in-out infinite;
      transform-origin: 1050px 100px;
    }
    .anim-circle-2 {
      animation: pulseCircle 8s ease-in-out infinite 1s;
      transform-origin: 150px 240px;
    }
    .anim-wave {
      animation: floatWave 5s ease-in-out infinite;
    }
    .anim-dash {
      stroke-dasharray: 12, 12;
      animation: dashMove 10s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Background Geometric Elements (Behind Text) -->
  <g opacity="0.25">
    <circle class="anim-circle-1" cx="1050" cy="100" r="180" fill="#818cf8" filter="url(#glow)" />
    <circle class="anim-circle-2" cx="150" cy="240" r="140" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Animated Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
  </g>

  <!-- Animated Wave Line -->
  <path class="anim-wave anim-dash" d="M -50 220 Q 250 140 550 230 T 1150 180" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.7" />

  <!-- Floating Financial / Flow Icons (Background Decorative) -->
  <g class="anim-wave" opacity="0.3" fill="none" stroke="#38bdf8" stroke-width="2">
    <!-- Invoice Icon -->
    <rect x="920" y="80" width="60" height="80" rx="6" />
    <line x1="935" y1="105" x2="965" y2="105" />
    <line x1="935" y1="125" x2="965" y2="125" />
    <line x1="935" y1="145" x2="955" y2="145" />

    <!-- Currency Flow Icon -->
    <circle cx="1030" cy="210" r="28" />
    <path d="M 1030 195 L 1030 225 M 1022 202 C 1022 202 1038 200 1038 209 C 1038 218 1022 216 1022 223 C 1022 230 1038 228 1038 228" />
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed readable above dynamic shapes) -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 50)">
      <rect width="240" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="12" y="21" class="badge-text">🚀 FINTECH &amp; TRADE FINANCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title">Awesome Invoice Financing Platform</text>
    <rect x="0" y="155" width="480" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle">Invoice Factoring, Supply Chain Finance &amp; Tokenized Working Capital Ecosystem</text>

    <!-- Stat Pill Highlights -->
    <g transform="translate(0, 230)">
      <rect width="170" height="36" rx="8" fill="#0f172a" opacity="0.8" stroke="#334155" />
      <text x="15" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">💼 10+ SaaS Platforms</text>

      <rect x="185" width="180" height="36" rx="8" fill="#0f172a" opacity="0.8" stroke="#334155" />
      <text x="200" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">⚡ 15+ Open-Source</text>

      <rect x="380" width="180" height="36" rx="8" fill="#0f172a" opacity="0.8" stroke="#334155" />
      <text x="395" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">🌐 Web3 &amp; DeFi Ready</text>
    </g>
  </g>
</svg>
