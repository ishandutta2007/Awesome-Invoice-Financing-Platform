<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseCircle{0%{transform:scale(1);opacity:.3}50%{transform:scale(1.15);opacity:.6}}@keyframes floatWave{0%{transform:translateY(0)}50%{transform:translateY(-12px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-1px}.subtitle{font-weight:400;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.anim-circle-1{animation:pulseCircle 6s ease-in-out infinite;transform-origin:1050px 100px}.anim-circle-2{animation:pulseCircle 8s ease-in-out infinite 1s;transform-origin:150px 240px}.anim-wave{animation:floatWave 5s ease-in-out infinite}.anim-dash{stroke-dasharray:12,12;animation:dashMove 10s linear infinite}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><g opacity=".25"><circle cx="1050" cy="100" r="180" fill="#818cf8" class="anim-circle-1" filter="url(#glow)"/><circle cx="150" cy="240" r="140" fill="#c084fc" class="anim-circle-2" filter="url(#glow)"/></g><g stroke="#334155" stroke-width="1" opacity=".4"><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="300" x2="300" y1="0" y2="320"/><line x1="600" x2="600" y1="0" y2="320"/><line x1="900" x2="900" y1="0" y2="320"/></g><path fill="none" stroke="url(#accentGrad)" stroke-width="3" d="M -50 220 Q 250 140 550 230 T 1150 180" class="anim-wave anim-dash" opacity=".7"/><g fill="none" stroke="#38bdf8" stroke-width="2" class="anim-wave" opacity=".3"><rect width="60" height="80" x="920" y="80" rx="6"/><line x1="935" x2="965" y1="105" y2="105"/><line x1="935" x2="965" y1="125" y2="125"/><line x1="935" x2="955" y1="145" y2="145"/><circle cx="1030" cy="210" r="28"/><path d="M 1030 195 L 1030 225 M 1022 202 C 1022 202 1038 200 1038 209 C 1038 218 1022 216 1022 223 C 1022 230 1038 228 1038 228"/></g><g transform="translate(80, 0)"><g transform="translate(0, 50)"><rect width="240" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="16"/><text x="12" y="21" class="badge-text">🚀 FINTECH &amp; TRADE FINANCE</text></g><text x="0" y="140" class="title">Awesome Invoice Financing Platform</text><rect width="480" height="4" x="0" y="155" fill="url(#accentGrad)" rx="2"/><text x="0" y="195" class="subtitle">Invoice Factoring, Supply Chain Finance &amp; Tokenized Working Capital Ecosystem</text><g transform="translate(0, 230)"><rect width="170" height="36" fill="#0f172a" stroke="#334155" opacity=".8" rx="8"/><text x="15" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">💼 10+ SaaS Platforms</text><rect width="180" height="36" x="185" fill="#0f172a" stroke="#334155" opacity=".8" rx="8"/><text x="200" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">⚡ 15+ Open-Source</text><rect width="180" height="36" x="380" fill="#0f172a" stroke="#334155" opacity=".8" rx="8"/><text x="395" y="23" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">🌐 Web3 &amp; DeFi Ready</text></g></g></svg>